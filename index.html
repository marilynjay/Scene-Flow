<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>Scene Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: sticky toolbar; left library rail (characters, places, climate); dense outline tree of section > scene cards with time slips between. */
:root {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --rail: #eceef3;
  --fg: #1c2130;
  --muted: #646b7d;
  --faint: #a2a8b6;
  --line: #dde0e8;
  --line-strong: #c9cdd8;
  --accent: #2d4f86;
  --accent-soft: #e3e9f5;
  --time: #8e5f14;
  --time-soft: #f7efe1;
  --ok: #3b8452;
  --danger: #b0413a;
  --hover: #f0f2f6;
  --shadow: 0 6px 24px rgba(20, 26, 40, .14), 0 1px 3px rgba(20, 26, 40, .08);
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --book: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --h1: #3f7fd0; --h2: #3fa35a; --h3: #e0b822; --h4: #e9822c; --h5: #d2402f;
  --fs: 12.5px;
  --fs-s: 11px;
  --row: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1b1e25; --rail: #171a20; --fg: #e2e5ec; --muted: #8e95a5; --faint: #5b6170;
    --line: #2a2e38; --line-strong: #383d49; --accent: #93b2ea; --accent-soft: #23304a; --time: #d9a85a;
    --time-soft: #2a2318; --ok: #6cbf86; --danger: #e07a72; --hover: #22262e;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1b1e25; --rail: #171a20; --fg: #e2e5ec; --muted: #8e95a5; --faint: #5b6170;
  --line: #2a2e38; --line-strong: #383d49; --accent: #93b2ea; --accent-soft: #23304a; --time: #d9a85a;
  --time-soft: #2a2318; --ok: #6cbf86; --danger: #e07a72; --hover: #22262e;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs)/1.35 var(--ui);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
svg.i { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }

/* ---------- toolbar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-block: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 0 1 auto; }
.brand .app { font: 600 10px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand .book { font: 600 14px/1.2 var(--book); min-width: 4ch; max-width: 28ch; overflow: hidden; white-space: nowrap; }
.tb { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: 4px; color: var(--muted); white-space: nowrap; }
.tb:hover { background: var(--hover); color: var(--fg); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.search { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--muted); flex: 0 1 200px; min-width: 110px; }
.search input { border: 0; background: none; outline: 0; width: 100%; min-width: 0; color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { height: 22px; padding: 0 8px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--hover); color: var(--fg); }
.seg-label { color: var(--faint); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .06em; }
.spacer { flex: 1; }
.stat { color: var(--faint); font: 400 var(--fs-s) var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.filterchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px 0 8px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.filterchip button { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; }
.filterchip button:hover { background: var(--panel); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 37px); }
.layout.norail { grid-template-columns: minmax(0, 1fr); }
.layout.norail .rail { display: none; }
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  position: sticky; top: calc(37px + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100dvh - 37px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 8px 24px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 8px;
}
main {
  padding-block: 10px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.tree { max-width: 980px; display: flex; flex-direction: column; gap: 3px; }

/* ---------- library rail ---------- */
.grp { margin-bottom: 10px; }
.grp-h { display: flex; align-items: center; gap: 4px; width: 100%; height: 22px; padding: 0 4px; color: var(--muted); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.grp-h .n { font: 400 10px var(--mono); color: var(--faint); letter-spacing: 0; }
.grp-h .caret { transition: transform .12s; }
.grp.open > .grp-h .caret { transform: rotate(90deg); }
.lib-row { display: flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 4px; border-radius: 4px; }
.lib-row:hover { background: var(--hover); }
.lib-row.on { background: var(--accent-soft); }
.swatch { position: relative; width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); overflow: hidden; }
.swatch.sq { border-radius: 3px; }
.swatch input { position: absolute; inset: -4px; opacity: 0; cursor: pointer; width: 20px; height: 20px; }
.lib-row .ed { flex: 1; min-width: 0; padding: 2px 0; }
.lcount { font: 400 10px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.ib { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 3px; color: var(--faint); flex: none; }
.ib:hover { color: var(--fg); background: var(--line); }
.lib-row .ib.hov { visibility: hidden; }
.lib-row:hover .ib.hov, .lib-row.on .ib.hov, .lib-row:focus-within .ib.hov { visibility: visible; }
.modal.notes { width: min(760px, 100%); height: min(780px, calc(100dvh - 32px)); }
.notes-head { display: flex; align-items: center; gap: 8px; }
.notes-head .av { width: 22px; height: 22px; font-size: 10px; }
.notes-head .swatch { width: 16px; height: 16px; }
.notes-head h2 { flex: 1; min-width: 0; }
.notes-head .stat { display: inline; }
.modal textarea.notes-ta { flex: 1; height: auto; min-height: 200px; resize: none; font: 400 12.5px/1.55 var(--ui); white-space: pre-wrap; padding: 8px 10px; }
.modal .hint { padding: 0; }
.lib-note { width: 100%; margin: 0 0 4px 21px; width: calc(100% - 25px); border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 4px 6px; resize: none; font: 400 var(--fs-s)/1.4 var(--ui); color: var(--fg); min-height: 22px; overflow: hidden; }
.lib-add { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px; color: var(--faint); }
.lib-add input { border: 0; background: none; outline: 0; width: 100%; min-width: 0; color: var(--fg); }
.lib-add input::placeholder { color: var(--faint); }
.clim { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 1px 6px; padding: 0 4px; }
.clim .m { font: 500 10px/22px var(--mono); color: var(--muted); text-transform: uppercase; }
.clim .ed { padding: 4px 0; font-size: var(--fs-s); border-bottom: 1px solid var(--line); }
.hint { color: var(--faint); font-size: var(--fs-s); padding: 2px 4px 6px; line-height: 1.4; }

/* ---------- editable text ---------- */
.ed { outline: 0; border-radius: 3px; overflow-wrap: anywhere; cursor: text; }
.ed:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }
.ed:focus { box-shadow: 0 0 0 1px var(--line-strong); background: var(--panel); }

/* ---------- tree rows ---------- */
.node { position: relative; }
.row { display: flex; align-items: center; gap: 5px; min-height: var(--row); padding: 0 4px 0 2px; border-radius: 4px; }
.grip { display: grid; place-items: center; width: 12px; height: 18px; color: var(--faint); cursor: grab; opacity: 0; flex: none; }
.row:hover > .grip, .row:focus-within > .grip { opacity: 1; }
.caret-b { display: grid; place-items: center; width: 16px; height: 18px; color: var(--muted); border-radius: 3px; flex: none; }
.caret-b:hover { background: var(--line); color: var(--fg); }
.caret-b svg { transition: transform .12s; }
.caret-b.open svg { transform: rotate(90deg); }
.caret-b.dimmed { color: var(--faint); }
.dots { opacity: 0; }
.row:hover .dots, .row:focus-within .dots { opacity: 1; }

/* sections */
.section > .row { min-height: 26px; }
.section .stitle { font-weight: 600; padding: 1px 3px; min-width: 6ch; }
.section.d0 > .row .stitle { font: 600 14.5px/1.25 var(--book); }
.section.d0 { margin-top: 8px; }
.section.d0:first-child { margin-top: 0; }
.section.d1 > .row .stitle { font-size: 13px; }
.section.d2 > .row .stitle, .section.d3 > .row .stitle { font-size: 12.5px; color: var(--muted); }
.section > .row .count { font: 400 10px var(--mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 2px; margin-left: auto; opacity: 0; }
.row:hover .acts, .row:focus-within .acts { opacity: 1; }
.acts button { height: 18px; padding: 0 5px; border-radius: 3px; color: var(--muted); font-size: var(--fs-s); white-space: nowrap; }
.acts button:hover { background: var(--accent-soft); color: var(--accent); }
.kids { display: flex; flex-direction: column; gap: 3px; margin: 1px 0 4px 9px; padding-left: 10px; border-left: 1px solid var(--line); }
.emptykid { color: var(--faint); font-size: var(--fs-s); padding: 3px 4px; }
.emptykid button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.section.dim > .row { opacity: .45; }

/* scene cards */
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.scene:hover { border-color: var(--line-strong); }
.scene > .row { cursor: default; }
.scene.dim { opacity: .38; }
.scene.dim:hover { opacity: .8; }
.num { font: 400 10px/1 var(--mono); color: var(--faint); min-width: 16px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
.st[data-s="1"] { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.st[data-s="2"] { border-color: var(--ok); background: var(--ok); }
.scene .title { font-weight: 500; padding: 1px 3px; min-width: 6ch; flex: 0 1 auto; }
.peek { flex: 1 1 0; min-width: 0; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: italic 400 11.5px/1 var(--book); padding-left: 4px; cursor: pointer; }
.fill { flex: 1 1 0; align-self: stretch; cursor: pointer; }
.body { padding: 0 8px 6px 37px; display: flex; flex-direction: column; gap: 3px; }
textarea.summary, textarea.details {
  display: block; width: 100%; resize: none; overflow: hidden; border: 1px solid transparent; border-radius: 3px;
  background: none; padding: 3px 5px; margin: 0; outline: 0; field-sizing: content; min-height: 22px;
}
textarea.summary { font: 400 12px/1.5 var(--book); color: var(--fg); }
textarea.details { font: 400 12px/1.45 var(--ui); color: var(--fg); background: var(--bg); border-color: var(--line); min-height: 44px; }
textarea.summary:hover { border-color: var(--line); }
textarea:focus { border-color: var(--line-strong) !important; background: var(--panel); }
textarea::placeholder { color: var(--faint); }
.more { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 18px; padding: 0 5px 0 3px; border-radius: 3px; color: var(--muted); font-size: var(--fs-s); }
.more:hover { background: var(--hover); color: var(--fg); }
.more svg { transition: transform .12s; }
.more.on svg { transform: rotate(90deg); }
.more .wc { color: var(--faint); font-family: var(--mono); font-size: 10px; }

/* plaques */
.plaques { display: flex; align-items: center; gap: 3px; margin-left: auto; flex: none; }
.plq { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; }
.plq:hover { border-color: var(--line-strong); color: var(--fg); }
.plq.pov { width: 76px; }
.plq.place { width: 104px; background: color-mix(in srgb, var(--c, var(--bg)) 14%, var(--panel)); border-color: color-mix(in srgb, var(--c, var(--line)) 35%, var(--line)); }
.plq.chars { width: 78px; padding-left: 4px; }
.plq .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--fg); }
.plq.empty { background: none; border-style: dashed; color: var(--faint); opacity: 0; }
.row:hover .plq.empty, .row:focus-within .plq.empty, .plq.empty:focus-visible { opacity: 1; }
@media (hover: none) { .plq.empty, .grip, .dots, .acts { opacity: .6; } }
.av { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--c); color: #fff; font: 600 8.5px/1 var(--ui); letter-spacing: .02em; flex: none; text-shadow: 0 0 2px rgba(0,0,0,.25); }
.stack { display: inline-flex; }
.stack .av { box-shadow: 0 0 0 1.5px var(--bg); }
.stack .av + .av { margin-left: -3px; }
.more-n { font: 500 10px var(--mono); color: var(--muted); margin-left: 3px; }

/* time slips */
.time > .row { background: var(--time-soft); border: 1px dashed color-mix(in srgb, var(--time) 40%, transparent); color: var(--time); gap: 6px; margin-block: 2px; }
.time .tlabel { font-weight: 600; color: var(--time); padding: 1px 3px; min-width: 10ch; }
.time .weather { color: var(--fg); padding: 1px 3px; min-width: 10ch; flex: 1 1 auto; font-size: 12px; }
.time .weather:empty::before { color: var(--muted); font-style: italic; }
.time .weather.auto:empty::before { color: color-mix(in srgb, var(--time) 70%, var(--muted)); }
.time select { height: 18px; border: 1px solid color-mix(in srgb, var(--time) 35%, transparent); border-radius: 3px; background: var(--panel); color: var(--time); font: 500 10.5px var(--mono); padding: 0 2px; flex: none; }
.time .sep { color: color-mix(in srgb, var(--time) 50%, transparent); }
.time.dim { opacity: .45; }

/* intensity heatmap */
.scene { position: relative; }
.scene > .row { padding-left: 6px; }
.heat-tab { position: absolute; left: -1px; top: -1px; bottom: -1px; width: 5px; border-radius: 4px 0 0 4px; background: transparent; z-index: 1; }
.scene:hover > .heat-tab { background: var(--line-strong); }
.heaton .heat-tab { background: var(--line); }
.scene[data-h] > .heat-tab { background: transparent; }
.heaton .scene[data-h] > .heat-tab, .scene[data-h]:hover > .heat-tab { background: var(--hc); }
.heat-tab:hover { width: 8px; }
.heaton .scene[data-h] { background: color-mix(in srgb, var(--hc) 9%, var(--panel)); border-color: color-mix(in srgb, var(--hc) 30%, var(--line)); }
.hsw { width: 12px; height: 12px; border-radius: 3px; background: var(--hc, var(--line)); flex: none; }
.flow { display: none; max-width: 980px; margin-bottom: 10px; padding: 6px 8px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.heaton .flow { display: block; }
.flow-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: var(--fs-s); color: var(--muted); margin-bottom: 4px; }
.flow-h b { font-weight: 600; text-transform: uppercase; letter-spacing: .07em; font-size: 10px; }
.flow-key { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.flow-key span { display: inline-flex; align-items: center; gap: 3px; }
.flow-key .hsw { width: 8px; height: 8px; border-radius: 2px; }
.bars { display: flex; align-items: flex-end; gap: 1px; height: 38px; overflow-x: auto; }
.hbar { flex: 1 1 0; min-width: 3px; max-width: 22px; height: calc(var(--v) * 20%); background: var(--hc); border-radius: 2px 2px 0 0; }
.hbar.none { height: 3px; background: var(--line-strong); }
.hbar.dim { opacity: .3; }
.hbar:hover { filter: brightness(1.15); outline: 1px solid var(--fg); }
.bars .gap { flex: none; width: 6px; align-self: stretch; border-left: 1px dashed var(--line-strong); margin-left: 5px; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }

/* holding area */
.holding-wrap { margin-top: 22px; }
.section.holding { background: var(--rail); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 4px 6px 6px 2px; }
.section.holding > .row .stitle { font: 600 13px/1.25 var(--ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); cursor: default; }
.section.holding > .row .hint { padding: 0; margin-left: 4px; }
.section.holding > .kids { border-left: 0; margin-left: 0; padding-left: 4px; }
.mi .ind { display: inline-block; flex: none; }

/* drag and drop */
.node.dragging { opacity: .35; }
.row.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.row.drop-after { box-shadow: 0 2px 0 var(--accent); }
.row.drop-into { background: var(--accent-soft); outline: 1px dashed var(--accent); }

/* root add row */
.rootadd { display: flex; gap: 6px; margin-top: 10px; padding-left: 20px; flex-wrap: wrap; }
.rootadd button { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px dashed var(--line-strong); border-radius: 4px; color: var(--muted); font-size: var(--fs-s); }
.rootadd button:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* popovers, menu, modal, toast */
.pop { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; min-width: 180px; max-width: min(260px, calc(100vw - 16px)); }
.pk-search { width: 100%; height: 24px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: var(--bg); outline: 0; margin-bottom: 3px; }
.pk-search:focus { border-color: var(--accent); }
.pk-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; }
.pk-item, .mi { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 24px; padding: 2px 6px; border-radius: 4px; text-align: left; }
.pk-item:hover, .mi:hover, .pk-item.kb { background: var(--hover); }
.pk-item .chk { width: 12px; color: var(--accent); flex: none; display: grid; place-items: center; }
.pk-item.add { color: var(--accent); }
.pk-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-head { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 3px 6px 2px; }
.mi { color: var(--fg); }
.mi .k { margin-left: auto; color: var(--faint); font-size: 10px; }
.mi.danger { color: var(--danger); }
.mi[disabled] { color: var(--faint); cursor: default; background: none; }
.msep { height: 1px; background: var(--line); margin: 3px 2px; }

}
function initials(name) {

  if (!p.length) return '?';
  return (p.length === 1 ? p[0].slice(0, 2) : p[0][0] + p[p.length - 1][0]).toUpperCase();
}
const firstName = (name) => (name || '').trim().split(/\s+/)[0] || '?';
const words = (t) => (t || '').trim() ? t.trim().split(/\s+/).length : 0;

/* ================= state ================= */

let filter = null;          // {type:'char'|'place', id}

let railOpen = true;
const undoStack = [];

  const c = (name, color, note = '') => ({ id: uid(), name, color, note });
  const p = (name, color, note = '') => ({ id: uid(), name, color, note });
  const ellie = c('Ellie Hart', PALETTE[0], 'Example character. 19, first year. Hides nerves with jokes.');

    title: 'Untitled novel (example)',

function normalize(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.items)) throw new Error('This doesn’t look like a Scene Flow backup.');

  s.title = s.title || 'Untitled novel';
  s.characters = Array.isArray(s.characters) ? s.characters : [];
  s.places = Array.isArray(s.places) ? s.places : [];
  s.climate = Array.from({ length: 12 }, (_, i) => (s.climate && s.climate[i]) || '');
  s.ui = s.ui || {}; s.ui.lib = Object.assign({ chars: true, places: true, climate: false }, s.ui.lib);
  if (s.ui.heat == null) s.ui.heat = true;
  for (const lib of [s.characters, s.places]) for (const x of lib) { x.id = x.id || uid(); x.name = x.name || ''; x.color = x.color || PALETTE[0]; x.note = x.note || ''; }
  if (!s.holding || !Array.isArray(s.holding.children)) s.holding = blankHolding();
  Object.assign(s.holding, { id: 'holding', type: 'section', title: 'Holding' });
  walk([...s.items, s.holding], (n) => {
    n.id = n.id || uid();
    if (n.type === 'section') n.children = Array.isArray(n.children) ? n.children : [];

  });

}
function load() {

}
let saveT;
function save() {

}
function flush() { if (!saveT) return; clearTimeout(saveT); saveT = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }

/* tree utilities */

function sceneMatches(s) {

    lastSec = parent;

      title: `${num}. ${n.title || 'Untitled scene'} · ${n.heat ? HEAT[n.heat] : 'no intensity set'}${parent && parent.title ? ` (${parent.title})` : ''}`,

    h('div', { class: 'flow-h' }, h('b', null, 'Intensity flow'),
      h('span', null, total ? `${set}/${total} scenes rated${set ? ` · average ${(sum / set).toFixed(1)}` : ''}` : 'No scenes yet'),
      h('span', { class: 'flow-key' }, [1, 2, 3, 4, 5].map((v) => h('span', { title: HEAT_HINT[v] }, h('span', { class: 'hsw', style: `--hc:var(--h${v})` }), HEAT[v])))),
    bars);

function reveal(id) {

  const dig = (list) => { for (const n of list) { if (n.id === id) return true; if (n.children) { path.push(n); if (dig(n.children)) return true; path.pop(); } } return false; };
  dig(everything());
  path.forEach((sec) => { sec.collapsed = false; });
  save(); renderTree();
  const el = $(`[data-id="${id}"]`);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function openHeat(anchor, scene) {

    h('div', { class: 'pk-head' }, 'Intensity · press 1–5'),
    [1, 2, 3, 4, 5].map((v) => h('button', { class: 'mi', onclick: () => choose(v) },
      h('span', { class: 'hsw', style: `--hc:var(--h${v})` }), `${v} ${HEAT[v]}`, h('span', { class: 'k' }, HEAT_HINT[v]),
      scene.heat === v ? icon('check') : null)),

    if (n.type === 'section') into.append(renderSection(n, depth, nums));
    else if (n.type === 'scene') into.append(renderScene(n, nums.get(n.id)));
    else if (n.type === 'time') into.append(renderTime(n));

function grip() {

}

}

function renderSection(n, depth, nums) {

  let anyMatch = true;
  if (filtering()) { anyMatch = false; walk(n.children, (x) => { if (x.type === 'scene' && sceneMatches(x)) anyMatch = true; }); }
  const add = (type) => (e) => { e.stopPropagation(); addInside(n, type); };
  const row = h('div', { class: 'row' },
    grip(),
    h('button', { class: 'caret-b' + (n.collapsed ? '' : ' open'), title: 'Collapse / expand (Alt-click: everything inside)', 'aria-expanded': String(!n.collapsed),
      onclick: (e) => {
        const to = !n.collapsed;
        n.collapsed = to;
        if (e.altKey) walk(n.children, (x) => { if (x.type === 'section') x.collapsed = to; if (x.type === 'scene' && to) x.open = 0; });
        save(); renderTree();
      } }, icon('right')),
    editable('stitle', n.title, 'Untitled section', (v) => { n.title = v; }),
    h('span', { class: 'count' }, count ? `${count}` : ''),
    h('span', { class: 'acts' },
      h('button', { onclick: add('scene'), title: 'Add a scene at the end of this section' }, '+ Scene'),
      h('button', { onclick: add('time'), title: 'Add a time marker at the end of this section' }, '+ Time'),
      h('button', { onclick: add('section'), title: 'Add a sub-section' }, '+ Section')),
    dotsBtn(n));
  const node = h('div', { class: `node section d${Math.min(depth, 3)}${anyMatch ? '' : ' dim'}`, 'data-id': n.id }, row);
  if (!n.collapsed) {
    const kids = h('div', { class: 'kids' });
    renderList(n.children, kids, depth + 1, nums);
    if (!n.children.length) kids.append(h('div', { class: 'emptykid' }, 'Empty. ', h('button', { onclick: () => addInside(n, 'scene') }, 'Add a scene'), ' or drag one onto this heading.'));
    node.append(kids);
  }
  return node;
}

function createLib(type, name) {
  const lib = type === 'place' ? S.places : S.characters;
  const used = new Set(lib.map((x) => x.color));
  const color = PALETTE.find((c) => !used.has(c)) || PALETTE[lib.length % PALETTE.length];
  const x = { id: uid(), name, color, note: '' };
  lib.push(x);
  return x;
}
function removeLib(type, x) {
  snapshot();
  const lib = type === 'place' ? S.places : S.characters;
  lib.splice(lib.indexOf(x), 1);
  walk(everything(), (n) => {
    if (n.type !== 'scene') return;
    if (type === 'place' && n.place === x.id) n.place = null;
    if (type === 'char') { n.chars = n.chars.filter((c) => c !== x.id); if (n.pov === x.id) n.pov = null; }
  });
  if (filter && filter.id === x.id) filter = null;
  save(); renderAll();
  toast(`Deleted “${x.name || 'unnamed'}”`, 'Undo', undo);
}

/* ================= picker popover ================= */
let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function place(el, anchor) {
  document.body.append(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, ht = el.offsetHeight;
  let left = Math.min(r.right - w, innerWidth - w - 8); left = Math.max(8, left);
  let top = r.bottom + 4; if (top + ht > innerHeight - 8) top = Math.max(8, r.top - ht - 4);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function openPicker(anchor, kind, scene) {
  closePop();
  const lib = kind === 'place' ? S.places : S.characters;
  const isSel = (x) => kind === 'chars' ? scene.chars.includes(x.id) : scene[kind] === x.id;
  const input = h('input', { class: 'pk-search', placeholder: kind === 'place' ? 'Find or add a place…' : 'Find or add a character…', 'aria-label': 'Find or add' });
  const list = h('div', { class: 'pk-list', role: 'listbox' });
  const choose = (x) => {
    snapshot();
    if (kind === 'chars') {
      scene.chars = isSel(x) ? scene.chars.filter((c) => c !== x.id) : [...scene.chars, x.id];
    } else {
      scene[kind] = x && scene[kind] !== x.id ? x.id : null;
      if (kind === 'pov' && scene.pov && !scene.chars.includes(scene.pov)) scene.chars.unshift(scene.pov);
    }
    save(); renderTree(); renderRail();
    if (kind === 'chars') { draw(); input.focus(); } else closePop();
  };
  const create = () => {
    const name = input.value.trim(); if (!name) return;
    const x = createLib(kind === 'place' ? 'place' : 'char', name);
    input.value = '';
    choose(x);
  };
  let visible = [], hi = 0;
  const opts = () => [...list.querySelectorAll('.pk-item')];
  const mark = () => opts().forEach((b, i) => b.classList.toggle('kb', i === hi));
  // Names that start with what was typed come first, then a later word that starts with it, then anything containing it.
  const rank = (x, q) => { const n = x.name.toLowerCase(); return n.startsWith(q) ? 0 : n.split(/[\s(]+/).some((w) => w.startsWith(q)) ? 1 : 2; };
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    visible = lib.filter((x) => x.name.toLowerCase().includes(q));
    if (q) visible.sort((a, b) => rank(a, q) - rank(b, q));
    setKids(list, 
      h('div', { class: 'pk-head' }, kind === 'pov' ? 'Point of view' : kind === 'place' ? 'Place' : 'Characters present'),
      kind !== 'chars' && !q ? h('button', { class: 'pk-item', onclick: () => choose(null) }, h('span', { class: 'chk' }, !scene[kind] ? icon('check') : null), h('span', { class: 'nm', style: 'color:var(--muted)' }, 'None')) : null,
      visible.map((x) => h('button', { class: 'pk-item', role: 'option', 'aria-selected': String(isSel(x)), onclick: () => choose(x) },
        h('span', { class: 'chk' }, isSel(x) ? icon('check') : null),
        kind === 'place' ? h('span', { class: 'swatch sq', style: `--c:${x.color}` }) : h('span', { class: 'av', style: `--c:${x.color}` }, initials(x.name)),
        h('span', { class: 'nm' }, x.name || '(unnamed)'))),
      q && !lib.some((x) => x.name.toLowerCase() === q) ? h('button', { class: 'pk-item add', onclick: create }, h('span', { class: 'chk' }, icon('plus')), h('span', { class: 'nm' }, `Add “${input.value.trim()}”`)) : null);
    hi = Math.max(0, Math.min(hi, opts().length - 1));
    mark();
  };
  input.addEventListener('input', () => { hi = 0; draw(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePop();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      hi = Math.max(0, Math.min(opts().length - 1, hi + (e.key === 'ArrowDown' ? 1 : -1)));
      mark(); opts()[hi]?.scrollIntoView({ block: 'nearest' });
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const b = opts()[hi]; if (!b) return;
      b.click();
      if (kind === 'chars' && pop) { input.value = ''; hi = 0; draw(); }
    }
  });
  pop = h('div', { class: 'pop picker' }, input, list);
  draw();
  place(pop, anchor);
  input.focus();
}

function openMenu(anchor, n) {

  const items = [];

    items.push(mi('Add scene inside', () => addInside(n, 'scene')), mi('Add time marker inside', () => addInside(n, 'time')), mi('Add sub-section inside', () => addInside(n, 'section')), h('div', { class: 'msep' }), mi('Add section below', () => addAfter(n, 'section')));
  } else {
    items.push(mi('Add scene below', () => addAfter(n, 'scene')), mi('Add time marker below', () => addAfter(n, 'time')));
  }
  const inHolding = hit.parent === S.holding;
  items.push(h('div', { class: 'msep' }),
    mi('Move up', () => shift(n, -1), { disabled: idx === 0 }),
    mi('Move down', () => shift(n, 1), { disabled: idx === hit.list.length - 1 }),
    h('button', { class: 'mi', onclick: () => openMoveTo(anchor, n) }, 'Move to…', h('span', { class: 'k' }, '▸')),
    inHolding ? null : mi('Move to holding', () => moveTo(n, 'holding')),
    mi('Duplicate', () => { snapshot(); hit.list.splice(idx + 1, 0, cloneNode(n)); save(); renderAll(); }),
    h('div', { class: 'msep' }),
    mi('Delete', () => removeNode(n), { danger: true }));
  pop = h('div', { class: 'pop menu' }, items);
  place(pop, anchor);
}
function openMoveTo(anchor, n) {
  closePop();
  const here = find(n.id); if (!here) return;
  const current = here.parent ? here.parent.id : null;
  const dests = [{ id: null, label: 'Top level of the outline', depth: 0 }];
  walk(S.items, (x, p, l, d) => {
    if (x.type === 'section' && x.id !== n.id && !containsId(n, x.id)) dests.push({ id: x.id, label: x.title || 'Untitled section', depth: d + 1 });
  });
  dests.push({ id: 'holding', label: 'Holding', depth: 0 });
  const input = h('input', { class: 'pk-search', placeholder: 'Find a section…', 'aria-label': 'Find a section' });
  const list = h('div', { class: 'pk-list' });
  let visible = [];
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    visible = dests.filter((d) => !q || d.label.toLowerCase().includes(q));
    setKids(list, h('div', { class: 'pk-head' }, `Move “${n.title || n.label || 'item'}” to the end of…`),
      visible.map((d) => h('button', { class: 'pk-item', onclick: () => { closePop(); moveTo(n, d.id); } },
        h('span', { class: 'chk' }, d.id === current ? icon('check') : null),
        h('span', { class: 'ind', style: `width:${(q ? 0 : Math.max(0, d.depth - 1)) * 12}px` }),
        h('span', { class: 'nm', style: d.id === 'holding' || d.id === null ? 'color:var(--muted)' : (d.depth === 1 ? 'font-weight:600' : null) }, d.label))),
      visible.length ? null : h('div', { class: 'emptykid' }, 'No section with that name.'));
  };
  input.addEventListener('input', draw);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePop();
    if (e.key === 'Enter' && visible.length) { e.preventDefault(); const d = visible[0]; closePop(); moveTo(n, d.id); }
  });
  pop = h('div', { class: 'pop picker' }, input, list);
  draw();
  place(pop, anchor);
  input.focus();
}
function moveTo(n, destId) {
  const src = find(n.id);
  const dest = destId === null ? null : find(destId);
  if (!src || (destId !== null && !dest) || (dest && (dest.node === n || containsId(n, destId)))) return;
  snapshot();
  src.list.splice(src.list.indexOf(n), 1);
  if (dest) { dest.node.children.push(n); dest.node.collapsed = false; } else S.items.push(n);
  save(); renderAll();
  reveal(n.id);
  toast(destId === 'holding' ? `Moved “${n.title || 'scene'}” to holding` : `Moved to ${dest ? `“${dest.node.title || 'Untitled section'}”` : 'the top level'}`, 'Undo', undo);
}
function newOf(type) { return type === 'scene' ? blankScene() : type === 'time' ? blankTime() : blankSection(); }
function focusNew(id) {
  setTimeout(() => {
    const el = $(`[data-id="${id}"] .ed`);
    if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
  });
}
function addInside(sec, type) { snapshot(); const x = newOf(type); sec.children.push(x); sec.collapsed = false; save(); renderAll(); focusNew(x.id); }
function addAfter(n, type) { snapshot(); const hit = find(n.id); const x = newOf(type); hit.list.splice(hit.list.indexOf(n) + 1, 0, x); save(); renderAll(); focusNew(x.id); }
function addRoot(type) { snapshot(); const x = newOf(type); S.items.push(x); save(); renderAll(); focusNew(x.id); }
function shift(n, d) {
  const { list } = find(n.id); const i = list.indexOf(n), j = i + d;
  if (j < 0 || j >= list.length) return;
  snapshot(); [list[i], list[j]] = [list[j], list[i]]; save(); renderTree();
}
function removeNode(n) {
  snapshot();
  const { list } = find(n.id);
  list.splice(list.indexOf(n), 1);
  save(); renderAll();
  const what = n.type === 'time' ? 'time marker' : n.type;
  const extra = n.type === 'section' && scenesIn(n) ? ` and ${scenesIn(n)} scene${scenesIn(n) > 1 ? 's' : ''}` : '';
  toast(`Deleted ${what}${n.title ? ` “${n.title}”` : ''}${extra}`, 'Undo', undo);
}

/* ================= drag and drop ================= */
let dragId = null, dropAt = null;
const tree = $('main');
function clearDrop() { tree.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach((r) => r.classList.remove('drop-before', 'drop-after', 'drop-into')); }
tree.addEventListener('dragstart', (e) => {
  const node = e.target.closest && e.target.closest('.node');
  if (!node || !node.draggable) return;
  dragId = node.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', node.querySelector('.ed')?.textContent || 'item'); } catch (err) { /* ignore */ }
  setTimeout(() => node.classList.add('dragging'));
  closePop();
});
tree.addEventListener('dragover', (e) => {
  if (!dragId) return;
  const row = e.target.closest('.row'); if (!row) return;
  const node = row.parentElement;
  const dragged = tree.querySelector(`[data-id="${dragId}"]`);
  if (!node || node === dragged || (dragged && dragged.contains(node))) { clearDrop(); dropAt = null; return; }
  e.preventDefault();
  const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
  const tgt = find(node.dataset.id);
  let pos;
  if (tgt && tgt.node === S.holding) pos = 'into';
  else if (tgt && tgt.node.type === 'section') pos = y < 0.3 ? 'before' : (tgt.node.collapsed && y > 0.75 ? 'after' : 'into');
  else pos = y < 0.5 ? 'before' : 'after';
  clearDrop();
  row.classList.add('drop-' + pos);
  dropAt = { id: node.dataset.id, pos };
});
tree.addEventListener('drop', (e) => {
  e.preventDefault();
  if (dragId && dropAt) moveNode(dragId, dropAt.id, dropAt.pos);
});
tree.addEventListener('dragend', () => {
  clearDrop();
  tree.querySelectorAll('.dragging').forEach((n) => n.classList.remove('dragging'));
  tree.querySelectorAll('[draggable="true"]').forEach((n) => { n.draggable = false; });
  dragId = null; dropAt = null;
});
function moveNode(id, targetId, pos) {
  const src = find(id), tgt = find(targetId);
  if (!src || !tgt || id === targetId || containsId(src.node, targetId)) return;
  snapshot();
  src.list.splice(src.list.indexOf(src.node), 1);
  if (pos === 'into') { tgt.node.children.push(src.node); tgt.node.collapsed = false; }
  else { const i = tgt.list.indexOf(tgt.node); tgt.list.splice(pos === 'before' ? i : i + 1, 0, src.node); }
  save(); renderTree();
}

/* ================= backup modal ================= */
function openBackup() {
  closePop();
  const json = JSON.stringify(S, null, 1);
  const ta = h('textarea', { id: 'backup-json', spellcheck: 'false', 'aria-label': 'Outline data' }); ta.value = json;
  const file = h('input', { type: 'file', accept: '.json,application/json', hidden: true,
    onchange: () => { const f = file.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { ta.value = rd.result; armed = false; replaceBtn.textContent = 'Replace outline with this'; }; rd.readAsText(f); } });
  let armed = false;
  const replaceBtn = h('button', { class: 'btn warn', onclick: () => {
    let next;
    try { next = normalize(JSON.parse(ta.value)); } catch (err) { toast('That text isn’t a valid backup. Paste the full text you copied, starting with {'); return; }
    if (!armed) { armed = true; replaceBtn.textContent = 'Click again to replace everything'; return; }
    snapshot(); S = next; save(); filter = null; scrim.remove(); renderAll(); toast('Outline restored', 'Undo', undo);
  } }, 'Replace outline with this');
  const scrim = h('div', { class: 'scrim', onclick: (e) => { if (e.target === scrim) scrim.remove(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'bk-h' },
      h('h2', { id: 'bk-h' }, 'Back up your outline'),
      h('p', null, 'Your outline saves automatically in this browser only. Copy this text or download it somewhere safe now and then. To restore, paste a backup here or open a saved file, then replace.'),
      ta,
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: async () => {
          try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (err) { ta.focus(); ta.select(); toast('Press Ctrl/⌘+C to copy'); }
        } }, 'Copy'),
        h('button', { class: 'btn', onclick: () => {
          const a = h('a', { href: URL.createObjectURL(new Blob([ta.value], { type: 'application/json' })), download: `${(S.title || 'outline').replace(/[^\w\- ]+/g, '').trim() || 'outline'}.sceneflow.json` });
          document.body.append(a); a.click(); a.remove();
        } }, 'Download file'),
        h('button', { class: 'btn', onclick: () => file.click() }, 'Open file…'),
        h('span', { class: 'spacer' }),
        replaceBtn, file),
      h('div', { class: 'btns' }, h('span', { class: 'spacer' }), h('button', { class: 'btn', onclick: () => scrim.remove() }, 'Close'))));
  document.body.append(scrim);
}

/* ================= share with AI ================= */
function outlineMarkdown(opt) {
  const names = (ids) => ids.map(charById).filter(Boolean).map((c) => c.name || '(unnamed)').join(', ');
  const usage = new Map(), povs = new Map();
  walk(S.items, (n) => {
    if (n.type !== 'scene') return;
    new Set([...n.chars, n.pov, n.place].filter(Boolean)).forEach((id) => usage.set(id, (usage.get(id) || 0) + 1));
    if (n.pov) povs.set(n.pov, (povs.get(n.pov) || 0) + 1);
  });
  const scenes = (k) => `${k} scene${k === 1 ? '' : 's'}`;
  // Short notes stay on the bullet line; longer ones keep their line breaks, indented under it.
  const noteText = (note) => {
    const t = (note || '').trim();
    if (!t) return '';
    return t.includes('\n') ? '\n' + indent(t, '    ') : ': ' + t;
  };
  const indent = (t, pad) => t.trim().split('\n').map((l) => pad + l).join('\n');
  const out = [];
  out.push(`# ${S.title || 'Untitled novel'}`, '');
  out.push('_Working scene outline for my novel, exported from Scene Flow. Sections and scenes are in story order; scenes are numbered in reading order. “Time” lines mark time passing between scenes. Intensity runs 1 (calm) to 5 (critical)._', '');
  if (S.characters.length) {
    out.push('## Characters', '');
    for (const c of S.characters) {
      const stats = [`in ${scenes(usage.get(c.id) || 0)}`, povs.get(c.id) ? `POV in ${povs.get(c.id)}` : null].filter(Boolean).join(', ');
      out.push(`- **${c.name || '(unnamed)'}** (${stats})${noteText(c.note)}`);
    }
    out.push('');
  }
  if (S.places.length) {
    out.push('## Places', '');
    for (const p of S.places) out.push(`- **${p.name || '(unnamed)'}** (in ${scenes(usage.get(p.id) || 0)})${noteText(p.note)}`);
    out.push('');
  }
  if (opt.climate && S.climate.some(Boolean)) {
    out.push('## Typical weather by month', '');
    S.climate.forEach((w, i) => { if (w) out.push(`- ${MONTHS[i]}: ${w}`); });
    out.push('');
  }
  out.push('## Outline', '');
  let num = 0, held = false;
  const list = (items, depth) => {
    for (const n of items) {
      if (n.type === 'section') {
        const t = n.title || 'Untitled section';
        out.push(depth < 4 ? `${'#'.repeat(depth + 3)} ${t}` : `**${t}**`, '');
        list(n.children, depth + 1);
      } else if (n.type === 'time') {
        const month = n.month ? MONTHS[n.month - 1] : '';
        const weather = n.weather || (n.month ? S.climate[n.month - 1] : '');
        const when = [n.label, month && `(${month})`].filter(Boolean).join(' ');
        out.push(`> **Time:** ${when || 'time passes'}${weather ? ` · Weather: ${weather}` : ''}`, '');
      } else if (n.type === 'scene') {
        if (!held) num++;
        out.push(`**${held ? 'Held scene' : `Scene ${num}`}: ${n.title || 'Untitled scene'}**${opt.status ? ` · _${STATUS[n.status || 0]}_` : ''}`);
        const pov = charById(n.pov), pl = placeById(n.place);
        const meta = [n.heat && `Intensity: ${n.heat}/5 (${HEAT[n.heat]})`, pov && `POV: ${pov.name}`, pl && `Place: ${pl.name}`, n.chars.length && `Present: ${names(n.chars)}`].filter(Boolean);
        if (meta.length) out.push(`- ${meta.join(' · ')}`);
        if (n.summary.trim()) out.push(`- Summary: ${n.summary.trim().replace(/\s*\n\s*/g, ' ')}`);
        if (opt.details && n.details.trim()) out.push('- Details:', indent(n.details, '    '));
        out.push('');
      }
    }
  };
  list(S.items, 0);
  if (opt.holding && S.holding.children.length) {
    out.push('## Holding (set aside, not currently in the story)', '');
    held = true;
    list(S.holding.children, 1);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function openAiExport() {
  closePop();
  const opt = { details: true, status: true, climate: true, holding: true };
  const ta = h('textarea', { id: 'ai-md', spellcheck: 'false', 'aria-label': 'Outline as text' });
  const words = h('span', { class: 'stat' });
  const refresh = () => { ta.value = outlineMarkdown(opt); words.textContent = `${ta.value.split(/\s+/).length.toLocaleString()} words`; };
  const box = (key, label) => h('label', { class: 'opt' },
    h('input', { type: 'checkbox', id: 'ai-' + key, checked: opt[key], onchange: (e) => { opt[key] = e.target.checked; refresh(); } }), label);
  const scrim = h('div', { class: 'scrim', onclick: (e) => { if (e.target === scrim) scrim.remove(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ai-h' },
      h('h2', { id: 'ai-h' }, 'Share with AI'),
      h('p', null, 'A plain-text version of your outline with names written out, so an AI can follow it easily. Copy it and paste it into a chat, then ask your question underneath. This is for reading only; use Backup to save or restore.'),
      h('div', { class: 'btns' }, box('details', 'Scene details'), box('status', 'Status'), box('climate', 'Weather table'), box('holding', 'Holding scenes')),
      ta,
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: async () => {
          try { await navigator.clipboard.writeText(ta.value); toast('Copied. Paste it into your AI chat.'); } catch (err) { ta.focus(); ta.select(); toast('Press Ctrl/⌘+C to copy'); }
        } }, 'Copy'),
        h('button', { class: 'btn', onclick: () => {
          const a = h('a', { href: URL.createObjectURL(new Blob([ta.value], { type: 'text/markdown' })), download: `${(S.title || 'outline').replace(/[^\w\- ]+/g, '').trim() || 'outline'}.md` });
          document.body.append(a); a.click(); a.remove();
        } }, 'Download .md'),
        h('span', { class: 'spacer' }), words,
        h('button', { class: 'btn', onclick: () => scrim.remove() }, 'Close'))));
  refresh();
  document.body.append(scrim);
}

/* ================= toast ================= */
let toastEl, toastT;
function toast(msg, action, fn) {
  if (toastEl) toastEl.remove();
  clearTimeout(toastT);
  toastEl = h('div', { class: 'toast', role: 'status' }, msg, action ? h('button', { onclick: () => { toastEl.remove(); fn(); } }, action) : null);
  document.body.append(toastEl);
  toastT = setTimeout(() => toastEl && toastEl.remove(), action ? 6000 : 1800);
}

/* ================= global events ================= */
document.addEventListener('pointerdown', (e) => { if (pop && !pop.contains(e.target)) closePop(); }, true);
document.addEventListener('keydown', (e) => {
  const t = e.target, typing = t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (e.key === 'Escape') { closePop(); $('.scrim')?.remove(); }
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); }
});
addEventListener('resize', () => { closePop(); applyRail(); });
window.addEventListener('scroll', closePop, { passive: true });

$('#rootadd').append(
  h('button', { onclick: () => addRoot('section') }, icon('plus'), 'Section'),
  h('button', { onclick: () => addRoot('scene') }, icon('plus'), 'Scene'),
  h('button', { onclick: () => addRoot('time') }, icon('plus'), 'Time marker'));

S = load();
railOpen = !matchMedia('(max-width: 760px)').matches;
applyRail();
renderAll();
})();
