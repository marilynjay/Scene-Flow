  if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
    document.querySelector('meta[name="viewport"]').content += ', maximum-scale=1';
</script>

<title>Scene Flow</title>

<style>
/* Layout: sticky toolbar; left library rail (characters, places, climate); dense outline tree of section > scene cards with time slips between. */
:root {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --rail: #eceef3;
  --fg: #1c2130;
  --muted: #646b7d;
  --faint: #a2a8b6;
  --line: #dde0e8;
  --line-strong: #c9cdd8;
  --accent: #2d4f86;
  --accent-soft: #e3e9f5;
  --time: #8e5f14;
  --time-soft: #f7efe1;
  --ok: #3b8452;
  --danger: #b0413a;
  --hover: #f0f2f6;
  --shadow: 0 6px 24px rgba(20, 26, 40, .14), 0 1px 3px rgba(20, 26, 40, .08);
  --ui: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --book: "Literata", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --h1: #3f7fd0; --h2: #3fa35a; --h3: #e0b822; --h4: #e9822c; --h5: #d2402f;
  --fs: 12.5px;
  --fs-s: 11px;
  --row: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1b1e25; --rail: #171a20; --fg: #e2e5ec; --muted: #8e95a5; --faint: #5b6170;
    --line: #2a2e38; --line-strong: #383d49; --accent: #93b2ea; --accent-soft: #23304a; --time: #d9a85a;
    --time-soft: #2a2318; --ok: #6cbf86; --danger: #e07a72; --hover: #22262e;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --panel: #1b1e25; --rail: #171a20; --fg: #e2e5ec; --muted: #8e95a5; --faint: #5b6170;
  --line: #2a2e38; --line-strong: #383d49; --accent: #93b2ea; --accent-soft: #23304a; --time: #d9a85a;
  --time-soft: #2a2318; --ok: #6cbf86; --danger: #e07a72; --hover: #22262e;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 var(--fs)/1.35 var(--ui);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
svg.i { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }

/* ---------- toolbar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-block: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 0 1 auto; }
.brand .app { font: 600 10px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand .book { font: 600 14px/1.2 var(--book); min-width: 4ch; max-width: 28ch; overflow: hidden; white-space: nowrap; }
.tb { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px; border-radius: 4px; color: var(--muted); white-space: nowrap; }
.tb:hover { background: var(--hover); color: var(--fg); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.search { display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--muted); flex: 0 1 200px; min-width: 110px; }
.search input { border: 0; background: none; outline: 0; width: 100%; min-width: 0; color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { height: 22px; padding: 0 8px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--hover); color: var(--fg); }
.seg-label { color: var(--faint); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .06em; }
.spacer { flex: 1; }
.stat { color: var(--faint); font: 400 var(--fs-s) var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.filterchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px 0 8px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 37px); }
.layout.norail { grid-template-columns: minmax(0, 1fr); }
.layout.norail .rail { display: none; }
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  position: sticky; top: calc(37px + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100dvh - 37px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 8px 24px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 8px;
}
main {
  padding-block: 10px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.tree { max-width: 980px; display: flex; flex-direction: column; gap: 3px; }

/* ---------- library rail ---------- */
.grp { margin-bottom: 10px; }
.rail-close { display: none; align-items: center; justify-content: flex-end; gap: 4px; width: 100%; height: 32px; padding: 0 6px; color: var(--muted); font-size: 14px; }
.grp-h { display: flex; align-items: center; gap: 4px; width: 100%; height: 22px; padding: 0 4px; color: var(--muted); font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.grp-h .n { font: 400 10px var(--mono); color: var(--faint); letter-spacing: 0; }
.grp-h .caret { transition: transform .12s; }
.grp.open > .grp-h .caret { transform: rotate(90deg); }
.lib-row { display: flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 4px; border-radius: 4px; }
.lib-row:hover { background: var(--hover); }
.lib-row.on { background: var(--accent-soft); }
.swatch { position: relative; width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); overflow: hidden; }
.swatch.sq { border-radius: 3px; }
.swatch input { position: absolute; inset: -4px; opacity: 0; cursor: pointer; width: 20px; height: 20px; }
.lib-row .ed { flex: 1; min-width: 0; padding: 2px 0; }
.lcount { font: 400 10px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.ib { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 3px; color: var(--faint); flex: none; }
.ib:hover { color: var(--fg); background: var(--line); }
.lib-row .ib.hov { visibility: hidden; }
.lib-row:hover .ib.hov, .lib-row.on .ib.hov, .lib-row:focus-within .ib.hov { visibility: visible; }
.lib-row { cursor: pointer; }
.lib-row .lname { flex: 1; min-width: 0; padding: 3px 0; overflow-wrap: anywhere; }
.colour-pick { position: relative; display: grid; place-items: center; flex: none; cursor: pointer; }
.colour-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.colour-pick .av { width: 26px; height: 26px; font-size: 11px; }
.colour-pick .swatch { width: 18px; height: 18px; }
.details-name { flex: 1; min-width: 0; font: 600 15px/1.2 var(--book); border: 1px solid transparent; border-radius: 4px; background: none; padding: 4px 6px; outline: 0; }
.details-name:hover { border-color: var(--line); }
.details-name:focus { border-color: var(--accent); background: var(--bg); }
.profile { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 2px 2px 8px; }
.details-name.ro { cursor: default; }
.details-name.ro:hover { border-color: transparent; }
.pf-top { display: flex; flex-direction: column; gap: 6px; }
.pf-alias { font: italic 400 14px/1.3 var(--book); color: var(--accent); }
.pf-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.pf-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--hover); border: 1px solid var(--line); font-size: 12px; color: var(--fg); }
.pf-sec { display: flex; flex-direction: column; gap: 4px; }
.pf-sec h3, .pf-label, .pf-k { margin: 0; font: 600 10.5px/1.2 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pf-text { white-space: pre-wrap; overflow-wrap: anywhere; font: 400 13px/1.55 var(--book); color: var(--fg); max-width: 70ch; }
.pf-arc { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
.pf-card { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.pf-card .pf-text { font-size: 12.5px; }
.pf-arrow { align-self: center; color: var(--faint); font-size: 16px; }
.pf-empty { color: var(--muted); font-size: 13px; }
.pf-empty button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.eye { width: 34px; height: 20px; flex: none; color: var(--muted); display: block; }
.eye.big { width: 46px; height: 27px; }
.eye-row { display: flex; align-items: center; gap: 6px; }
.eye-row > input { flex: 1; min-width: 0; }
.eye-pick { position: relative; display: grid; place-items: center; width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; flex: none; }
.eye-pick:hover { border-color: var(--accent); }
.eye-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.eye-clear { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: var(--faint); flex: none; }
.eye-clear:hover { background: var(--line); color: var(--fg); }
.pf-looks { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 2px 0 4px; align-items: center; }
.pf-looks dt { font: 600 10.5px/1.2 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.pf-looks dd { margin: 0; font: 400 13px/1.45 var(--book); color: var(--fg); }
.pf-eyes { display: flex; align-items: center; gap: 10px; }
.pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }
.pf-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pf-field input, .pf-ta { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); padding: 5px 7px; outline: 0; font: 400 13px/1.45 var(--ui); color: var(--fg); }
.modal .pf-ta { height: auto; resize: none; overflow: hidden; field-sizing: content; min-height: 34px; font: 400 13px/1.5 var(--ui); padding: 5px 7px; }
.pf-field input:focus, .pf-ta:focus { border-color: var(--accent); background: var(--panel); }
.pf-field input::placeholder, .pf-ta::placeholder { color: var(--faint); }
@media (max-width: 600px) { .pf-arc { grid-template-columns: minmax(0, 1fr); } .pf-arrow { transform: rotate(90deg); justify-self: center; } .pf-grid { grid-template-columns: minmax(0, 1fr); } }
@media (hover: none) { .pf-field input, .modal .pf-ta { font-size: 16px; } }
.modal.notes { width: min(760px, 100%); height: min(780px, calc(100dvh - 32px)); }
.notes-head { display: flex; align-items: center; gap: 8px; }
.notes-head .av { width: 22px; height: 22px; font-size: 10px; }
.notes-head .swatch { width: 16px; height: 16px; }
.notes-head h2 { flex: 1; min-width: 0; }
.notes-head .stat { display: inline; }
.modal textarea.notes-ta { flex: 1; height: auto; min-height: 200px; resize: none; font: 400 12.5px/1.55 var(--ui); white-space: pre-wrap; padding: 8px 10px; }
.modal .hint { padding: 0; }
.lib-note { width: 100%; margin: 0 0 4px 21px; width: calc(100% - 25px); border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 4px 6px; resize: none; font: 400 var(--fs-s)/1.4 var(--ui); color: var(--fg); min-height: 22px; overflow: hidden; }
.lib-add { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px; color: var(--faint); }
.lib-add input { border: 0; background: none; outline: 0; width: 100%; min-width: 0; color: var(--fg); }
.lib-add input::placeholder { color: var(--faint); }
.clim { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 1px 6px; padding: 0 4px; }
.clim .m { font: 500 10px/22px var(--mono); color: var(--muted); text-transform: uppercase; }
.clim .ed { padding: 4px 0; font-size: var(--fs-s); border-bottom: 1px solid var(--line); }
.hint { color: var(--faint); font-size: var(--fs-s); padding: 2px 4px 6px; line-height: 1.4; }

/* ---------- editable text ---------- */
.ed { outline: 0; border-radius: 3px; overflow-wrap: anywhere; cursor: text; }
.ed:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }
.ed:focus { box-shadow: 0 0 0 1px var(--line-strong); background: var(--panel); }

/* ---------- tree rows ---------- */
.node { position: relative; }
.row { display: flex; align-items: center; gap: 5px; min-height: var(--row); padding: 0 4px 0 2px; border-radius: 4px; }
.grip { display: grid; place-items: center; width: 12px; height: 18px; color: var(--faint); cursor: grab; opacity: 0; flex: none; }
.row:hover > .grip, .row:focus-within > .grip { opacity: 1; }
.caret-b { display: grid; place-items: center; width: 16px; height: 18px; color: var(--muted); border-radius: 3px; flex: none; }
.caret-b:hover { background: var(--line); color: var(--fg); }
.caret-b svg { transition: transform .12s; }
.caret-b.open svg { transform: rotate(90deg); }
.caret-b.dimmed { color: var(--faint); }
.dots { opacity: 0; }
.row:hover .dots, .row:focus-within .dots { opacity: 1; }

/* sections */
.section > .row { min-height: 26px; }
.section .stitle { font-weight: 600; padding: 1px 3px; min-width: 6ch; }
.section.d0 > .row .stitle { font: 600 14.5px/1.25 var(--book); }
.section.d0 { margin-top: 8px; }
.section.d0:first-child { margin-top: 0; }
.section.d1 > .row .stitle { font-size: 13px; }
.section.d2 > .row .stitle, .section.d3 > .row .stitle { font-size: 12.5px; color: var(--muted); }
.section > .row .count { font: 400 10px var(--mono); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 2px; margin-left: auto; opacity: 0; }
.row:hover .acts, .row:focus-within .acts { opacity: 1; }
.acts button { height: 18px; padding: 0 5px; border-radius: 3px; color: var(--muted); font-size: var(--fs-s); white-space: nowrap; }
.acts button:hover { background: var(--accent-soft); color: var(--accent); }
.kids { display: flex; flex-direction: column; gap: 3px; margin: 1px 0 4px 9px; padding-left: 10px; border-left: 1px solid var(--line); }
.emptykid { color: var(--faint); font-size: var(--fs-s); padding: 3px 4px; }
.emptykid button { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.section.dim > .row { opacity: .45; }

/* scene cards */
.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.scene:hover { border-color: var(--line-strong); }
.scene > .row { cursor: default; }
.scene.dim { opacity: .38; }
.scene.dim:hover { opacity: .8; }
.num { font: 400 10px/1 var(--mono); color: var(--faint); min-width: 16px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; }
.st[data-s="1"] { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.st[data-s="2"] { border-color: var(--ok); background: var(--ok); }
.scene .title { font-weight: 500; padding: 1px 3px; min-width: 6ch; flex: 0 1 auto; }
.peek { flex: 1 1 0; min-width: 0; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: italic 400 11.5px/1 var(--book); padding-left: 4px; cursor: pointer; }
.fill { flex: 1 1 0; align-self: stretch; cursor: pointer; }
.body { padding: 0 8px 6px 37px; display: flex; flex-direction: column; gap: 3px; }
textarea.summary, textarea.details {
  display: block; width: 100%; resize: none; overflow: hidden; border: 1px solid transparent; border-radius: 3px;
  background: none; padding: 3px 5px; margin: 0; outline: 0; field-sizing: content; min-height: 22px;
}
textarea.summary { font: 400 12px/1.5 var(--book); color: var(--fg); }
textarea.details { font: 400 12px/1.45 var(--ui); color: var(--fg); background: var(--bg); border-color: var(--line); min-height: 44px; }
textarea.summary:hover { border-color: var(--line); }
textarea:focus { border-color: var(--line-strong) !important; background: var(--panel); }
textarea::placeholder { color: var(--faint); }
.more { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 18px; padding: 0 5px 0 3px; border-radius: 3px; color: var(--muted); font-size: var(--fs-s); }
.more:hover { background: var(--hover); color: var(--fg); }
.more svg { transition: transform .12s; }
.more.on svg { transform: rotate(90deg); }
.more .wc { color: var(--faint); font-family: var(--mono); font-size: 10px; }

/* plaques */
.plaques { display: flex; align-items: center; gap: 3px; margin-left: auto; flex: none; }
.plq { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; }
.plq:hover { border-color: var(--line-strong); color: var(--fg); }
.plq.pov { width: 76px; }
.plq.place { width: 104px; background: color-mix(in srgb, var(--c, var(--bg)) 14%, var(--panel)); border-color: color-mix(in srgb, var(--c, var(--line)) 35%, var(--line)); }
.plq.chars { width: 78px; padding-left: 4px; }
.plq.threads { width: 92px; }
.tbars { display: inline-flex; gap: 2px; flex: none; }
.tbar { width: 4px; height: 12px; border-radius: 2px; background: var(--c); }
.swatch.thr { border-radius: 2px; width: 6px; height: 14px; }
.tchips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 0 5px; }
.tchip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 6px; border-radius: 10px; font-size: var(--fs-s); color: var(--fg);
  background: color-mix(in srgb, var(--c) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); }
.tchip::before { content: ""; width: 4px; height: 10px; border-radius: 2px; background: var(--c); }
.tchip:hover { border-color: var(--c); }
.filterchip { gap: 4px; padding: 0 3px 0 8px; height: 24px; }
.filterchip .fc-name { font-weight: 600; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-mode { display: inline-flex; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 9px; overflow: hidden; margin-left: 2px; }
.fc-mode button { height: 18px; padding: 0 7px; font-size: 10.5px; font-weight: 500; color: var(--accent); }
.fc-mode button.on { background: var(--accent); color: var(--panel); }
.filterchip .fc-x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
.filterchip .fc-x:hover { background: var(--panel); }

/* Character profile fields, in display order. `short` ones sit in a compact grid; the rest are paragraphs. */
const CHAR_FIELDS = [
  { k: 'alias', label: 'Title or alias', short: true, hint: 'e.g. Atom-Ripper, The Hammer' },
  { k: 'age', label: 'Age', short: true, hint: 'e.g. 19, late 50s' },
  { k: 'group', label: 'Group or role', short: true, hint: 'e.g. Freshman · CHAR Unit, Faculty' },
  { k: 'track', label: 'Track', short: true, hint: 'e.g. Combat, Ancillary' },
  { k: 'height', label: 'Height', short: true, hint: 'e.g. 5′3″, tall for her age' },
  { k: 'hair', label: 'Hair', short: true, hint: 'e.g. chestnut, high messy bun' },
  { k: 'eyes', label: 'Eyes', short: true, hint: 'e.g. green, flash red when angry' },
  { k: 'appearance', label: 'Other appearance details', hint: 'Build, skin, clothes, style, scars, how they carry themselves' },
  { k: 'power', label: 'Power', hint: 'What they can do, its limits and costs' },
  { k: 'growth', label: 'Power growth', hint: 'How their power changes over the story' },
  { k: 'growthStart', label: 'At the start', hint: 'What they can do when the story begins' },
  { k: 'growthEnd', label: 'By the end', hint: 'What they can do by the end' },
  { k: 'personality', label: 'Personality', hint: 'Temperament, voice, habits, fears, what they want' },
  { k: 'backstory', label: 'Backstory', hint: 'Family, history, why they’re here' },
  { k: 'relationships', label: 'Relationships', hint: 'Friends, rivals, family, crushes, grudges' },
  { k: 'note', label: 'Other notes', hint: 'Anything else: secrets, plot notes, reminders' },
];
const PLACE_FIELDS = [{ k: 'note', label: 'Description', hint: 'What it looks, sounds and smells like, who goes there, what happened here' }];
const THREAD_FIELDS = [{ k: 'note', label: 'Description', hint: 'What this thread is about, who drives it, where it’s heading' }];
const fieldsFor = (type) => (type === 'place' ? PLACE_FIELDS : type === 'thread' ? THREAD_FIELDS : CHAR_FIELDS);
const libFor = (type) => (type === 'place' ? S.places : type === 'thread' ? S.threads : S.characters);
const threadById = (id) => S.threads.find((t) => t.id === id);

// Notes imported in the "Title / Group · Track · Age" layout are split into profile fields once.
// Anything that doesn't fit a field stays in Other notes, so nothing is lost.
function splitProfileNote(c) {
  const text = (c.note || '').replace(/\r/g, '').trim();
  const lines = text.split('\n');
  const isMeta = (l) => /^(Freshman|Sophomore|Junior|Senior|Faculty)\b/.test(l || '') || (/ · /.test(l || '') && /(Age |track)/i.test(l || ''));
  let meta, from;
  if (isMeta(lines[0])) { meta = lines[0]; from = 1; }                       // "Sophomore · stand-out", then sections
  else if (lines.length > 1 && isMeta(lines[1])) { c.alias = lines[0].trim(); meta = lines[1]; from = 2; } // "Atom-Ripper", "Freshman · … · Age 19"
  else return;
  const rest = [];
  for (const part of meta.split(' · ').map((t) => t.trim()).filter(Boolean)) {
    if (/^Age\b/i.test(part)) c.age = part.replace(/^Age\s*/i, '');
    else if (/\btrack$/i.test(part)) c.track = part.replace(/\s*track$/i, '');
    else rest.push(part);
  }
  c.group = rest.join(' · ');
  const other = [];
  const blocks = lines.slice(from).join('\n').split(/\n\s*\n/).map((b) => b.replace(/^\n+|\s+$/g, '')).filter((b) => b.trim());
  // A block's text without its label: "Power: X" → "X"; a heading on its own line ("Backstory") is dropped.
  const body = (b) => {
    const ls = b.split('\n');
    if (ls[0].includes(':')) ls[0] = ls[0].replace(/^[^:]*:\s*/, ''); else ls.shift();
    return ls.map((l) => l.replace(/^ {2}/, '')).join('\n').trim();
  };
  const startEnd = (b) => {
    const out = { start: [], end: [] }; let cur = null;
    for (const l of b.split('\n').slice(1)) {
      const t = l.trim();
      if (/^Start:/i.test(t)) { cur = 'start'; out.start.push(t.replace(/^Start:\s*/i, '')); }
      else if (/^End:/i.test(t)) { cur = 'end'; out.end.push(t.replace(/^End:\s*/i, '')); }
      else if (cur) out[cur].push(l.replace(/^ {2}/, ''));
    }
    return cur ? { start: out.start.join('\n').trim(), end: out.end.join('\n').trim() } : null;
  };
  const add = (k, v) => { c[k] = c[k] ? c[k] + '\n\n' + v : v; };
  for (const b of blocks) {
    const head = b.split('\n')[0].trim();
    if (/^Appearance\b/i.test(head)) add('appearance', body(b));
    else if (/^Power escalation\s*—\s*Start/i.test(head)) add('growthStart', b.split('\n').slice(1).map((l) => l.replace(/^ {2}/, '')).join('\n').trim());
    else if (/^Power escalation\s*—\s*End/i.test(head)) add('growthEnd', b.split('\n').slice(1).map((l) => l.replace(/^ {2}/, '')).join('\n').trim());
    else if (/^Power escalation\b/i.test(head)) {
      const se = startEnd(b);
      if (se) { if (se.start) add('growthStart', se.start); if (se.end) add('growthEnd', se.end); } else add('growth', body(b));
    } else if (/^Powers?(:|$)/i.test(head)) add('power', body(b));
    else if (/^(Backstory|Background|Lore)(:|$)/i.test(head)) add('backstory', body(b));
    else other.push(b.trim());
  }
  c.note = other.join('\n\n');
}

function normalize(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.items)) throw new Error('This doesn’t look like a Scene Flow backup.');
  s.v = 1;
  s.title = s.title || 'Untitled novel';
  s.characters = Array.isArray(s.characters) ? s.characters : [];
  s.places = Array.isArray(s.places) ? s.places : [];
  s.threads = Array.isArray(s.threads) ? s.threads : [];
  s.climate = Array.from({ length: 12 }, (_, i) => (s.climate && s.climate[i]) || '');
  s.ui = s.ui || {}; s.ui.lib = Object.assign({ chars: true, places: true, threads: true, climate: false }, s.ui.lib);
  if (s.ui.heat == null) s.ui.heat = true;
  for (const lib of [s.characters, s.places, s.threads]) for (const x of lib) { x.id = x.id || uid(); x.name = x.name || ''; x.color = x.color || PALETTE[0]; x.note = x.note || ''; }
  for (const c of s.characters) {
    if (!c.profile) { splitProfileNote(c); c.profile = 1; }
    for (const f of CHAR_FIELDS) c[f.k] = typeof c[f.k] === 'string' ? c[f.k] : '';
    c.eyeColor = /^#[0-9a-f]{6}$/i.test(c.eyeColor || '') ? c.eyeColor : '';
  }
  // Outlines saved before the example was marked: recognise the untouched example book by its title.
  if (s.sample == null && s.title === 'Untitled novel (example)' && s.characters.some((c) => c.name === 'Ellie Hart')) s.sample = true;
  if (!s.holding || !Array.isArray(s.holding.children)) s.holding = blankHolding();
  Object.assign(s.holding, { id: 'holding', type: 'section', title: 'Holding' });
  walk([...s.items, s.holding], (n) => {
    n.id = n.id || uid();
    if (n.type === 'section') n.children = Array.isArray(n.children) ? n.children : [];
    if (n.type === 'scene') { n.chars = Array.isArray(n.chars) ? n.chars : []; n.threads = Array.isArray(n.threads) ? n.threads : []; n.open = n.open || 0; n.status = n.status || 0; n.heat = n.heat >= 1 && n.heat <= 5 ? n.heat : 0; }
  });
  return s;
}
function load() {
  try { const j = localStorage.getItem(KEY); if (j) return normalize(JSON.parse(j)); } catch (e) { /* fall through to sample */ }
  return normalize(sample());
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveT = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }, 250);
}
function flush() { if (!saveT) return; clearTimeout(saveT); saveT = null; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
function snapshot() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 60) undoStack.shift(); }
function undo() {
  if (!undoStack.length) return toast('Nothing to undo');
  S = JSON.parse(undoStack.pop()); save(); renderAll(); toast('Undone');
}

/* tree utilities */
function walk(list, fn, parent = null, depth = 0) { for (const n of list) { fn(n, parent, list, depth); if (n.children) walk(n.children, fn, n, depth + 1); } }
function find(id) {
  let r = null;
  const look = (n, p, l) => { if (n.id === id) r = { node: n, parent: p, list: l }; };
  walk(S.items, look);
  if (!r) walk([S.holding], look);
  return r;
}
// The story outline plus the holding area, for changes that must reach every scene.
const everything = () => [...S.items, S.holding];
function containsId(node, id) { return !!node.children && node.children.some((c) => c.id === id || containsId(c, id)); }
function scenesIn(node) { let c = 0; walk(node.children || [], (n) => { if (n.type === 'scene') c++; }); return c; }
const charById = (id) => S.characters.find((c) => c.id === id);
const placeById = (id) => S.places.find((p) => p.id === id);
function cloneNode(n) { const c = JSON.parse(JSON.stringify(n)); walk([c], (x) => { x.id = uid(); }); return c; }

function sceneMatches(s) {
  if (filter) {
    if (filter.type === 'char' && !(s.chars.includes(filter.id) || s.pov === filter.id)) return false;
    if (filter.type === 'place' && s.place !== filter.id) return false;
    if (filter.type === 'thread' && !s.threads.includes(filter.id)) return false;
  }
  if (query) {
    const q = query.toLowerCase();
    if (![s.title, s.summary, s.details].some((x) => (x || '').toLowerCase().includes(q))) return false;
  }
  return true;
}
const filtering = () => !!(filter || query);
// "Show only" hides what doesn't match instead of dimming it.
const hiding = () => filtering() && !!S.ui.only;
const sectionMatches = (sec) => { let any = false; walk(sec.children, (x) => { if (x.type === 'scene' && sceneMatches(x)) any = true; }); return any; };
const filterTarget = () => filter && (libFor(filter.type) || []).find((x) => x.id === filter.id);

function renderAll() { renderBar(); renderTree(); renderRail(); renderBanner(); }

}
function blankBook() {
  return normalize({ v: 1, title: 'Untitled novel', characters: [], places: [], climate: [], items: [], holding: blankHolding(),
    ui: { lib: { chars: true, places: true, climate: false }, heat: S ? S.ui.heat : true } });
}

let treeT;
function renderTreeSoon() { clearTimeout(treeT); treeT = setTimeout(renderTree, 300); }

function renderTree() {
  const root = $('#tree');
  const nums = new Map(); let k = 0;
  walk(S.items, (n) => { if (n.type === 'scene') nums.set(n.id, ++k); });
  const frag = document.createDocumentFragment();
  renderList(S.items, frag, 0, nums);
  root.replaceChildren(frag);
  if (!S.items.length) root.append(h('div', { class: 'emptykid' }, 'Nothing here yet. Start with a section (like “Part One” or “Arrival day”) or a scene below.'));
  else if (hiding() && !root.querySelector('.scene')) root.append(h('div', { class: 'emptykid' }, 'No scenes match this filter yet.'));
  setKids($('#holding'), renderHolding(nums));
  document.querySelectorAll('main textarea').forEach(grow);
  renderStat();
  renderFlow();
}
function renderFlow() {
  const flow = $('#flow');
  $('#layout').classList.toggle('heaton', !!S.ui.heat);
  if (!S.ui.heat) return flow.replaceChildren();
  const bars = h('div', { class: 'bars' });
  let num = 0, set = 0, total = 0, sum = 0, lastSec = null;
  walk(S.items, (n, parent) => {
    if (n.type !== 'scene') return;
    num++; total++;
    if (n.heat) { set++; sum += n.heat; }
    if (bars.children.length && parent !== lastSec) bars.append(h('span', { class: 'gap', title: parent ? parent.title : '' }));
    lastSec = parent;
    bars.append(h('button', { class: 'hbar' + (n.heat ? '' : ' none') + (sceneMatches(n) ? '' : ' dim'), style: n.heat ? `--v:${n.heat};--hc:var(--h${n.heat})` : null,
      title: `${num}. ${n.title || 'Untitled scene'} · ${n.heat ? HEAT[n.heat] : 'no intensity set'}${parent && parent.title ? ` (${parent.title})` : ''}`,
      'aria-label': `Go to scene ${num}`, onclick: () => reveal(n.id) }));
  });
  flow.hidden = !total;
  setKids(flow,
    h('div', { class: 'flow-h' }, h('b', null, 'Intensity flow'),
      h('span', null, total ? `${set}/${total} scenes rated${set ? ` · average ${(sum / set).toFixed(1)}` : ''}` : 'No scenes yet'),
      h('span', { class: 'flow-key' }, [1, 2, 3, 4, 5].map((v) => h('span', { title: HEAT_HINT[v] }, h('span', { class: 'hsw', style: `--hc:var(--h${v})` }), HEAT[v])))),
    bars);
}
function reveal(id) {
  const path = [];
  const dig = (list) => { for (const n of list) { if (n.id === id) return true; if (n.children) { path.push(n); if (dig(n.children)) return true; path.pop(); } } return false; };
  dig(everything());
  path.forEach((sec) => { sec.collapsed = false; });
  save(); renderTree();
  const el = $(`[data-id="${id}"]`);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function openHeat(anchor, scene) {
  closePop();
  const choose = (v) => { snapshot(); scene.heat = v; save(); renderTree(); closePop(); };
  pop = h('div', { class: 'pop menu' },
    h('div', { class: 'pk-head' }, 'Intensity · press 1–5'),
    [1, 2, 3, 4, 5].map((v) => h('button', { class: 'mi', onclick: () => choose(v) },
      h('span', { class: 'hsw', style: `--hc:var(--h${v})` }), `${v} ${HEAT[v]}`, h('span', { class: 'k' }, HEAT_HINT[v]),
      scene.heat === v ? icon('check') : null)),
    h('div', { class: 'msep' }),
    h('button', { class: 'mi', onclick: () => choose(0) }, h('span', { class: 'hsw' }), 'Not set'));
  pop.addEventListener('keydown', (e) => { if (/^[0-5]$/.test(e.key)) choose(+e.key); });
  place(pop, anchor);
  pop.style.minWidth = '260px';
  pop.querySelector('.mi').focus();
}
function renderList(list, into, depth, nums) {
  for (const n of list) {
    if (hiding() && ((n.type === 'scene' && !sceneMatches(n)) || (n.type === 'section' && !sectionMatches(n)))) continue;
    if (n.type === 'section') into.append(renderSection(n, depth, nums));
    else if (n.type === 'scene') into.append(renderScene(n, nums.get(n.id)));
    else if (n.type === 'time') into.append(renderTime(n));
  }
}

function renderSection(n, depth, nums) {
  const count = scenesIn(n);

      onclick: (e) => {

}

/* ================= drag and drop ================= */
let dragId = null, dropAt = null;
const tree = $('main');
function clearDrop() { tree.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach((r) => r.classList.remove('drop-before', 'drop-after', 'drop-into')); }
tree.addEventListener('dragstart', (e) => {
  const node = e.target.closest && e.target.closest('.node');
  if (!node || !node.draggable) return;
  dragId = node.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', node.querySelector('.ed')?.textContent || 'item'); } catch (err) { /* ignore */ }
  setTimeout(() => node.classList.add('dragging'));
  closePop();
});
tree.addEventListener('dragover', (e) => {
  if (!dragId) return;
  const row = e.target.closest('.row'); if (!row) return;
  const node = row.parentElement;
  const dragged = tree.querySelector(`[data-id="${dragId}"]`);
  if (!node || node === dragged || (dragged && dragged.contains(node))) { clearDrop(); dropAt = null; return; }
  e.preventDefault();
  const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
  const tgt = find(node.dataset.id);
  let pos;
  if (tgt && tgt.node === S.holding) pos = 'into';
  else if (tgt && tgt.node.type === 'section') pos = y < 0.3 ? 'before' : (tgt.node.collapsed && y > 0.75 ? 'after' : 'into');
  else pos = y < 0.5 ? 'before' : 'after';
  clearDrop();
  row.classList.add('drop-' + pos);
  dropAt = { id: node.dataset.id, pos };
});
tree.addEventListener('drop', (e) => {
  e.preventDefault();
  if (dragId && dropAt) moveNode(dragId, dropAt.id, dropAt.pos);
});
tree.addEventListener('dragend', () => {
  clearDrop();
  tree.querySelectorAll('.dragging').forEach((n) => n.classList.remove('dragging'));
  tree.querySelectorAll('[draggable="true"]').forEach((n) => { n.draggable = false; });
  dragId = null; dropAt = null;
});
function moveNode(id, targetId, pos) {
  const src = find(id), tgt = find(targetId);
  if (!src || !tgt || id === targetId || containsId(src.node, targetId)) return;
  snapshot();
  src.list.splice(src.list.indexOf(src.node), 1);
  if (pos === 'into') { tgt.node.children.push(src.node); tgt.node.collapsed = false; }
  else { const i = tgt.list.indexOf(tgt.node); tgt.list.splice(pos === 'before' ? i : i + 1, 0, src.node); }
  save(); renderTree();
}

    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'bk-h' },

        } }, 'Download file'),

        mergeBtn, replaceBtn, file),

/* ================= share with AI ================= */
function outlineMarkdown(opt) {
  const names = (ids) => ids.map(charById).filter(Boolean).map((c) => c.name || '(unnamed)').join(', ');
  const usage = new Map(), povs = new Map();
  walk(S.items, (n) => {
    if (n.type !== 'scene') return;
    new Set([...n.chars, ...n.threads, n.pov, n.place].filter(Boolean)).forEach((id) => usage.set(id, (usage.get(id) || 0) + 1));
    if (n.pov) povs.set(n.pov, (povs.get(n.pov) || 0) + 1);
  });
  const scenes = (k) => `${k} scene${k === 1 ? '' : 's'}`;
  // Short notes stay on the bullet line; longer ones keep their line breaks, indented under it.
  const noteText = (note) => {
    const t = (note || '').trim();
    if (!t) return '';
    return t.includes('\n') ? '\n' + indent(t, '    ') : ': ' + t;
  };
  const indent = (t, pad) => t.trim().split('\n').map((l) => pad + l).join('\n');
  const out = [];
  out.push(`# ${S.title || 'Untitled novel'}`, '');
  out.push('_Working scene outline for my novel, exported from Scene Flow. Sections and scenes are in story order; scenes are numbered in reading order. “Time” lines mark time passing between scenes. Intensity runs 1 (calm) to 5 (critical)._', '');
  if (S.characters.length) {
    out.push('## Characters', '');
    for (const c of S.characters) {
      const stats = [`in ${scenes(usage.get(c.id) || 0)}`, povs.get(c.id) ? `POV in ${povs.get(c.id)}` : null].filter(Boolean).join(', ');
      const head = [c.alias, stats].filter(Boolean).join('; ');
      out.push(`- **${c.name || '(unnamed)'}** (${head})`);
      for (const f of CHAR_FIELDS) {
        if (f.k === 'alias') continue;
        const v = (c[f.k] || '').trim();
        if (!v) continue;
        out.push(v.includes('\n') ? `    ${f.label}:\n${indent(v, '        ')}` : `    ${f.label}: ${v}`);
      }
    }
    out.push('');
  }
  if (S.threads.length) {
    out.push('## Plot threads', '');
    for (const t of S.threads) out.push(`- **${t.name || '(unnamed)'}** (in ${scenes(usage.get(t.id) || 0)})${noteText(t.note)}`);
    out.push('');
  }
  if (S.places.length) {
    out.push('## Places', '');
    for (const p of S.places) out.push(`- **${p.name || '(unnamed)'}** (in ${scenes(usage.get(p.id) || 0)})${noteText(p.note)}`);
    out.push('');
  }
  if (opt.climate && S.climate.some(Boolean)) {
    out.push('## Typical weather by month', '');
    S.climate.forEach((w, i) => { if (w) out.push(`- ${MONTHS[i]}: ${w}`); });
    out.push('');
  }
  const ft = filterTarget();
  out.push(opt.onlyFilter && ft ? `## Outline (only scenes with ${ft.name}; scene numbers are from the full book)` : '## Outline', '');
  let num = 0, held = false;
  const list = (items, depth) => {
    for (const n of items) {
      if (n.type === 'section') {
        if (opt.onlyFilter && !sectionMatches(n)) { if (!held) num += scenesIn(n); continue; }
        const t = n.title || 'Untitled section';
        out.push(depth < 4 ? `${'#'.repeat(depth + 3)} ${t}` : `**${t}**`, '');
        list(n.children, depth + 1);
      } else if (n.type === 'time') {
        const month = n.month ? MONTHS[n.month - 1] : '';
        const weather = n.weather || (n.month ? S.climate[n.month - 1] : '');
        const when = [n.label, month && `(${month})`].filter(Boolean).join(' ');
        out.push(`> **Time:** ${when || 'time passes'}${weather ? ` · Weather: ${weather}` : ''}`, '');
      } else if (n.type === 'scene') {
        if (!held) num++;
        if (opt.onlyFilter && !sceneMatches(n)) continue;
        out.push(`**${held ? 'Held scene' : `Scene ${num}`}: ${n.title || 'Untitled scene'}**${opt.status ? ` · _${STATUS[n.status || 0]}_` : ''}`);
        const pov = charById(n.pov), pl = placeById(n.place);
        const ths = n.threads.map(threadById).filter(Boolean).map((t) => t.name).join(', ');
        const meta = [ths && `Threads: ${ths}`, n.heat && `Intensity: ${n.heat}/5 (${HEAT[n.heat]})`, pov && `POV: ${pov.name}`, pl && `Place: ${pl.name}`, n.chars.length && `Present: ${names(n.chars)}`].filter(Boolean);
        if (meta.length) out.push(`- ${meta.join(' · ')}`);
        if (n.summary.trim()) out.push(`- Summary: ${n.summary.trim().replace(/\s*\n\s*/g, ' ')}`);
        if (opt.details && n.details.trim()) out.push('- Details:', indent(n.details, '    '));
        out.push('');
      }
    }
  };
  list(S.items, 0);
  if (opt.holding && S.holding.children.length) {
    out.push('## Holding (set aside, not currently in the story)', '');
    held = true;
    list(S.holding.children, 1);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function openAiExport() {
  closePop();
  const opt = { details: true, status: true, climate: true, holding: true, onlyFilter: !!filter };
  const ta = h('textarea', { id: 'ai-md', spellcheck: 'false', 'aria-label': 'Outline as text' });
  const words = h('span', { class: 'stat' });
  const refresh = () => { ta.value = outlineMarkdown(opt); words.textContent = `${ta.value.split(/\s+/).length.toLocaleString()} words`; };
  const box = (key, label) => h('label', { class: 'opt' },
    h('input', { type: 'checkbox', id: 'ai-' + key, checked: opt[key], onchange: (e) => { opt[key] = e.target.checked; refresh(); } }), label);
  const scrim = h('div', { class: 'scrim', onclick: (e) => { if (e.target === scrim) scrim.remove(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'ai-h' },
      h('h2', { id: 'ai-h' }, 'Share with AI'),
      h('p', null, 'A plain-text version of your outline with names written out, so an AI can follow it easily. Copy it and paste it into a chat, then ask your question underneath. This is for reading only; use Backup to save or restore.'),
      h('div', { class: 'btns' }, box('details', 'Scene details'), box('status', 'Status'), box('climate', 'Weather table'), box('holding', 'Holding scenes'), filter && filterTarget() ? box('onlyFilter', `Only scenes with ${filterTarget().name}`) : null),
      ta,
      h('div', { class: 'btns' },
        h('button', { class: 'btn primary', onclick: async () => {
          try { await navigator.clipboard.writeText(ta.value); toast('Copied. Paste it into your AI chat.'); } catch (err) { ta.focus(); ta.select(); toast('Press Ctrl/⌘+C to copy'); }
        } }, 'Copy'),
        h('button', { class: 'btn', onclick: () => {
          const a = h('a', { href: URL.createObjectURL(new Blob([ta.value], { type: 'text/markdown' })), download: `${(S.title || 'outline').replace(/[^\w\- ]+/g, '').trim() || 'outline'}.md` });
          document.body.append(a); a.click(); a.remove();
        } }, 'Download .md'),
        h('span', { class: 'spacer' }), words,
        h('button', { class: 'btn', onclick: () => scrim.remove() }, 'Close'))));
  refresh();
  document.body.append(scrim);
}

/* ================= toast ================= */
let toastEl, toastT;
function toast(msg, action, fn) {
  if (toastEl) toastEl.remove();
  clearTimeout(toastT);
  toastEl = h('div', { class: 'toast', role: 'status' }, msg, action ? h('button', { onclick: () => { toastEl.remove(); fn(); } }, action) : null);
  document.body.append(toastEl);
  toastT = setTimeout(() => toastEl && toastEl.remove(), action ? 6000 : 1800);
}

/* ================= global events ================= */
document.addEventListener('pointerdown', (e) => {
  if (pop && !pop.contains(e.target)) closePop();
  // On narrow screens the library is a drawer; a tap outside it (but not in a window opened from it) closes it.
  if ($('#layout').classList.contains('railopen') && !e.target.closest('#rail, .scrim, .pop, .pop-scrim, [aria-label="Toggle library"]')) { closeRail(); swallowClick = true; }
}, true);
// The tap that closes the drawer shouldn't also press whatever is underneath it.
let swallowClick = false;
document.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('pointerup', () => { setTimeout(() => { swallowClick = false; }, 400); }, true);
document.addEventListener('keydown', (e) => {
  const t = e.target, typing = t.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (e.key === 'Escape') { closePop(); $('.scrim')?.remove(); }
  if (typing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); }
});
addEventListener('resize', () => { if (!TOUCH) closePop(); applyRail(); });
window.addEventListener('scroll', () => { if (!TOUCH) closePop(); }, { passive: true });

$('#rootadd').append(
  h('button', { onclick: () => addRoot('section') }, icon('plus'), 'Section'),
  h('button', { onclick: () => addRoot('scene') }, icon('plus'), 'Scene'),
  h('button', { onclick: () => addRoot('time') }, icon('plus'), 'Time marker'));

// iPhone/iPad zoom in when a small-text field is tapped; maximum-scale stops that (pinch zoom still works there).
if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
  const vp = document.querySelector('meta[name="viewport"]');
  if (vp && !/maximum-scale/.test(vp.content)) vp.content += ', maximum-scale=1';
}

S = load();
railOpen = !matchMedia('(max-width: 760px)').matches;
applyRail();
renderAll();
})();
